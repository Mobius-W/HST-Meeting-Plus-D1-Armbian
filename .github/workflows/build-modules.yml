name: Build out-of-tree modules (RK3399-MID)

# 只编译 kernel-modules/ 下的树外驱动，不碰内核镜像，跑一次约 2 分钟。
#
# 为什么要单独一条流水线：
#   设备上运行的 6.18.63-current-rockchip64 内核不会因为加驱动而重编，
#   树外模块对同一份 linux-headers 编译 ⇒ vermagic 与在跑内核完全一致，
#   产物可以直接 scp 到设备 `insmod` 验证，不用重刷整机。
#
# 依赖：prebuilt/ 下的 linux-headers deb（与本机内核同一次构建的产物）。
#   若以后升级内核，把新的 headers deb 换进 prebuilt/ 即可。

on:
  workflow_dispatch:
  push:
    paths:
      - "kernel-modules/**"
      - "prebuilt/linux-headers-*.deb"
      - ".github/workflows/build-modules.yml"

concurrency:
  group: modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-compile modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make bc bison flex libssl-dev libelf-dev
          # 内核 6.18 的 Makefile 无条件加了 -fmin-function-alignment=8，
          # 那是 GCC 14 才有的选项；noble 默认交叉 gcc 是 13，会直接报
          # "unrecognized command-line option"。所以固定用 gcc-14。
          sudo apt-get install -y --no-install-recommends \
            gcc-14-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc-14 --version | head -1
          echo "CC=aarch64-linux-gnu-gcc-14" >> "$GITHUB_ENV"

      - name: Unpack kernel headers
        run: |
          set -eux
          mkdir -p /tmp/hdr
          cd /tmp/hdr
          # deb 是 ar 归档：data.tar.xz 里就是 /usr/src/linux-headers-<ver>
          ar x "$GITHUB_WORKSPACE"/prebuilt/linux-headers-*.deb
          tar -xf data.tar.xz
          HDR=$(echo /tmp/hdr/usr/src/linux-headers-*)
          test -f "$HDR/Module.symvers"
          echo "HDR=$HDR" >> "$GITHUB_ENV"
          cat "$HDR/include/config/kernel.release"

      - name: Prepare headers (build host tools)
        run: |
          # headers deb 里没有预编译的宿主机工具（scripts/basic/fixdep 等），
          # 直接编模块会报 "/bin/sh: fixdep: not found" + Error 127。
          # modules_prepare 会用宿主 gcc 把 fixdep / modpost 等建出来。
          set -u
          make -C "$HDR" -j"$(nproc)" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC" \
            modules_prepare 2>&1 | tail -25
          test -x "$HDR/scripts/basic/fixdep"
          ls -l "$HDR/scripts/basic/fixdep" "$HDR/scripts/mod/modpost" 2>/dev/null || true

      - name: Build modules
        run: |
          set -u
          LOG=/tmp/build.log
          : > "$LOG"
          rc=0
          for m in kernel-modules/*/; do
            [ -f "$m/Makefile" ] || continue
            echo "==> building $m" | tee -a "$LOG"
            if ! make -C "$HDR" M="$PWD/${m%/}" \
                 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CC" \
                 modules >> "$LOG" 2>&1; then
              rc=1
            fi
          done
          echo "---- tail of build log ----"
          tail -60 "$LOG"
          if [ "$rc" -ne 0 ]; then
            # 把错误行变成注解，方便从 API 直接读到（日志下载经常被网络掐）。
            # 除了 error: 行，也把日志尾部整体带出来 —— Error 127 这类
            # “命令找不到”不会出现在 error: 行里。
            grep -E "error:|Error [0-9]|unrecognized|No such file|not found" "$LOG" \
              | head -15 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            tail -12 "$LOG" | while IFS= read -r line; do
              echo "::error::TAIL $line"
            done
            exit 1
          fi

      - name: Inspect result
        run: |
          set -eux
          find kernel-modules -name '*.ko' -exec ls -l {} \;
          for ko in $(find kernel-modules -name '*.ko'); do
            echo "--- $ko"
            modinfo "$ko" | grep -E '^(filename|license|description|vermagic|parm):' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ko-rk3399-mid-${{ github.run_number }}
          path: kernel-modules/**/*.ko
          if-no-files-found: error
          retention-days: 30
