name: Build Armbian image (RK3399-MID, mainline boot)

# 在 GitHub Actions 上用官方 armbian/build 源码编译 RK3399-MID 的完整 Armbian 镜像。
# ★ 2026-11-15 路径1：引导链完全对齐 armbian 官方 rockpi-4b（binman-atf-mainline），
#   产物 = 单个 u-boot-rockchip.bin 写到 LBA64；LBA64 IDB / LBA16384 FIT / MBR p1@32768。
#   不产出 vendor PARM / LOADER@8192 / BL3X@16384，也不再有 -parm 变体。
#   旧的 vendor only-blobs 版留档 docs/_废弃-vendor-only-blobs-workflow-20261115.yml.bak
# 板级配置来源：本仓库 armbian/userpatches/（免 fork armbian/build）

on:
  workflow_dispatch:
    inputs:
      release:
        description: "用户空间发行版"
        required: false
        default: "noble"
        type: choice
        options: [noble, trixie, bookworm]
      desktop:
        description: "是否构建桌面版（默认 minimal CLI）"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "armbian/**"
      - ".github/workflows/build-armbian.yml"
    branches: [main]

concurrency:
  group: armbian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Armbian rk3399-mid (${{ inputs.release || 'noble' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------- 1. 取源码 ----------
      - name: Checkout this repo (customisations)
        uses: actions/checkout@v4
        with:
          path: custom
          fetch-depth: 1

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          path: build
          fetch-depth: 1

      - name: Checkout Armbian os (userspace / packages)
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          path: os
          fetch-depth: 1

      # ---------- 2. 拼 userpatches ----------
      - name: Prepare userpatches
        run: |
          set -euo pipefail
          mkdir -pv build/userpatches
          if [ -d os/userpatches ]; then
            rsync -a os/userpatches/ build/userpatches/
          fi
          rsync -a custom/armbian/userpatches/ build/userpatches/
          # add-trust-ini.patch 是 vendor only-blobs 的 trust_merger 依赖（新增 trust.ini），
          # mainline binman-atf-mainline 不用它；显式排除，避免旧路线残留进入补丁序列。
          rm -f build/userpatches/u-boot/v2026.10/add-trust-ini.patch
          echo "=== userpatches 清单 ==="
          find build/userpatches -type f | sort
          echo
          echo "=== 板级配置（前 40 行） ==="
          head -40 build/userpatches/config/boards/rk3399-mid.csc

      # ---------- 3. 主机依赖 ----------
      - name: Install build requirements
        run: |
          set -euo pipefail
          cd build
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .

      # ---------- 4. 编译 ----------
      - name: Build Armbian image
        run: |
          set -euo pipefail
          cd build
          ./compile.sh build \
            BOARD=rk3399-mid \
            BRANCH=current \
            RELEASE="${{ inputs.release || 'noble' }}" \
            BUILD_DESKTOP="${{ inputs.desktop && 'yes' || 'no' }}" \
            BUILD_MINIMAL="${{ inputs.desktop && 'no' || 'yes' }}" \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=img \
            SHARE_LOG=yes \
            EXPERT=yes

      # ---------- 5. 产物自检（官方 mainline 引导锚点） ----------
      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd build
          echo "=== output/images ==="
          ls -la output/images/ || true
          echo
          echo "=== armbian u-boot deb ==="
          ls -la output/debs/*u-boot* 2>/dev/null || true

          mkdir -p ubootpkg
          for DEB in output/debs/linux-u-boot-rk3399-mid-*.deb; do
            [ -e "$DEB" ] || continue
            echo "--- 解包 $DEB"
            dpkg-deb -x "$DEB" ubootpkg
          done

          echo
          echo "=== 引导件（mainline 必须是单一 u-boot-rockchip.bin） ==="
          find ubootpkg -type f | sort
          UBIN=$(find ubootpkg -type f -name 'u-boot-rockchip.bin' | head -1 || true)
          if [ -z "$UBIN" ]; then
            echo "::error::缺少 u-boot-rockchip.bin => BOOT_SCENARIO 未走 binman-atf-mainline"
            exit 1
          fi
          echo "--- $UBIN ($(stat -c%s "$UBIN") B)"
          xxd -l 32 "$UBIN"
          if find ubootpkg -type f \( -name 'uboot.img' -o -name 'trust.bin' -o -name 'idbloader.bin' \) | grep -q .; then
            echo "::error::deb 仍在产出 vendor only-blobs 三件套，方向未切换"
            exit 1
          fi

          IMG=$(ls output/images/*.img 2>/dev/null | head -1 || true)
          if [ -z "$IMG" ]; then
            echo "::error::output/images 下没有产出 .img"
            exit 1
          fi
          echo "=== $IMG 关键扇区魔数 ==="
          python3 - "$IMG" <<'PY'
          import sys, os, struct
          p = sys.argv[1]
          f = open(p, "rb")

          def peek(lba, n=32):
              f.seek(lba * 512)
              return f.read(n)

          checks = [
              (0,     "MBR (p1@32768)"),
              (1,     "LBA1 (应为空)"),
              (64,    "IDB: DDR blob TPL + SPL"),
              (8192,  "vendor LOADER 位（应全零）"),
              (16384, "mainline FIT (TF-A + U-Boot)"),
              (24576, "vendor trust 位（应全零）"),
              (32768, "p1 起点"),
          ]
          for lba, name in checks:
              d = peek(lba)
              txt = "".join(chr(b) if 32 <= b < 127 else "." for b in d)
              print(f"  LBA {lba:>6}  {name:<32} {d[:8].hex(' ')}  {txt[:8]}")
          print(f"  image size = {os.path.getsize(p)/1048576:.1f} MiB")

          # 路径1硬校验：与官方 rockpi-4b / WF7000A 实盘的引导锚点一致
          errors = []
          l0 = peek(0, 512)
          if l0[510:512] != b"\x55\xaa":
              errors.append("LBA0 无 MBR 签名 55aa（官方 mainline 镜像为 MBR，p1@32768）")
          if peek(64, 4) != bytes.fromhex("3b8cdcfc"):
              errors.append("LBA64 缺少 Rockchip IDB 魔数 3b8cdcfc -> BootROM 找不到首级引导")
          fit = peek(16384, 4096)
          if fit[:4] != bytes.fromhex("d00dfeed"):
              errors.append("LBA16384 缺少 FIT 魔数 d00dfeed -> mainline U-Boot 未落盘")
          if peek(8192, 6) == b"LOADER":
              errors.append("LBA8192 仍有 vendor LOADER -> 仍在 only-blobs 路线")
          if peek(24576, 4) == b"BL3X":
              errors.append("LBA24576 仍有 vendor BL3X trust -> 仍在 only-blobs 路线")
          total = struct.unpack_from(">I", fit, 4)[0]
          print(f"  FIT totalsize = {total} B；含 TF-A 节点 = "
                f"{b'arm-trusted-firmware' in fit}；含 vendor bl30/bl32 = "
                f"{b'bl30' in fit or b'bl32' in fit}")
          if b"arm-trusted-firmware" not in fit:
              errors.append("FIT 内没有 mainline TF-A 镜像节点 -> binman-atf-mainline 未生效")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("::notice::mainline 引导锚点硬校验 PASS：MBR / LBA64 IDB / LBA16384 FIT，且无 vendor 容器")
          PY

          echo "=== 引导件与镜像 LBA64 区一致性 ==="
          python3 - "$IMG" "$UBIN" <<'PY'
          import sys
          img, ubin = sys.argv[1], sys.argv[2]
          a = open(img, "rb")
          b = open(ubin, "rb").read()
          a.seek(64 * 512)
          d = a.read(len(b))
          same = sum(x == y for x, y in zip(d, b))
          print(f"  u-boot-rockchip.bin {len(b)} B，与镜像 LBA64 起逐字节相同 {same}/{len(b)}")
          if d != b:
              print("::error::镜像 LBA64 区与 deb 内 u-boot-rockchip.bin 不一致")
              sys.exit(1)
          PY

      # ---------- 6. 引导布局报告（纯只读，供实刷对照） ----------
      - name: Boot layout report
        run: |
          set -euo pipefail
          UBIN=$(find build/ubootpkg -type f -name 'u-boot-rockchip.bin' | head -1 || true)
          if [ -z "$UBIN" ]; then
            echo "::warning::未找到 u-boot-rockchip.bin，跳过"
            exit 0
          fi
          python3 - "$UBIN" <<'PY'
          import sys, struct
          d = open(sys.argv[1], "rb").read()
          print(f"  u-boot-rockchip.bin = {len(d)} B，头 4B (IDB) = {d[:4].hex(' ')}")
          offs, i = [], 0
          while True:
              i = d.find(b"\xd0\x0d\xfe\xed", i)
              if i < 0:
                  break
              offs.append(i)
              i += 1
          for o in offs:
              tot = struct.unpack_from(">I", d, o + 4)[0]
              print(f"  FIT magic @ 0x{o:x} -> 落盘 LBA {64 + o//512}, totalsize={tot} B")
          print("  期望布局：IDB@LBA64、FIT@LBA16384、MBR p1@LBA32768（与官方 rockpi-4b 一致）")
          PY

      # ---------- 7. 收集产物 ----------
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find build/output/images -maxdepth 1 -type f -exec cp -a {} out/ \; || true
          find build/output/debs -maxdepth 2 -type f -name '*.deb' -exec cp -a {} out/ \; || true
          # mainline：引导件是单一 u-boot-rockchip.bin（内含 IDB + FIT）。
          # 实刷时按官方 write_uboot_platform 的 dd bs=32k seek=1 写入 LBA64，
          # 不要按 vendor 坐标分件写（PARM / LOADER@8192 / BL3X@16384 已全部废弃）。
          for f in $(find build/ubootpkg -type f -name 'u-boot-rockchip.bin' 2>/dev/null); do
            cp -a "$f" out/boot-u-boot-rockchip.bin
          done
          # 确认本板 DTB 真的被注入并编译出来了
          for f in $(find build -path '*boot/dts/rockchip/rk3399-mid.dtb' 2>/dev/null | head -3); do
            cp -a "$f" out/ 2>/dev/null || true
          done
          echo "=== out/ ==="
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3399-mid-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
